<main><header><h1>빛의 항해</h1><p>SF 거북선 항해 시뮬레이션</p></header>
<canvas id="sea" width="1000" height="525" aria-label="파도 위를 항해하는 SF 거북선"></canvas>
<section aria-label="항해 설정">
<label>순풍 <output id="windOut"></output><input id="wind" type="range" min="0" max="20" value="8"></label>
<label>파고 <output id="waveOut"></output><input id="wave" type="range" min="0" max="5" step=".1" value="1.2"></label>
<label>보조 추진 <output id="driveOut"></output><input id="drive" type="range" min="0" max="100" value="40"></label>
<div>속력 <strong id="speed"></strong><br>항해 거리 <strong id="distance"></strong></div>
</section>
<button id="toggle" class="primary">일시 정지</button><button id="reset">처음부터</button>
<small>순풍과 보조 추진은 속력을 높이고, 파고가 높아지면 속력이 줄고 배가 더 크게 흔들립니다. 수치는 체험용 모형입니다.</small>
</main>

  const w=Number(wind.value), h=Number(wave.value), d=Number(drive.value);
  get('windOut').textContent=w+' m/s';
  get('waveOut').textContent=h.toFixed(1)+' m';
  get('driveOut').textContent=d+'%';
  return {h,target:(w*.55+d*.13)/(1+h*.15)};
}
function paint(h){
  const sky=ctx.createLinearGradient(0,0,0,330);
  sky.addColorStop(0,'#102746'); sky.addColorStop(1,'#947080');
  ctx.fillStyle=sky;ctx.fillRect(0,0,1000,525);
  const glow=ctx.createRadialGradient(163,263,0,163,263,205);
  glow.addColorStop(0,'#ffc0859c');glow.addColorStop(1,'#ffc08500');
  ctx.fillStyle=glow;ctx.fillRect(0,0,1000,330);
  ctx.fillStyle='#354662';ctx.beginPath();ctx.moveTo(0,313);
  for(let x=0;x<=1000;x+=20)ctx.lineTo(x,295+11*Math.sin(x*.014)+6*Math.sin(x*.037));
  ctx.lineTo(1000,330);ctx.lineTo(0,330);ctx.fill();
  const sea=ctx.createLinearGradient(0,310,0,525);
  sea.addColorStop(0,'#415979');sea.addColorStop(1,'#061727');
  ctx.fillStyle=sea;ctx.fillRect(0,312,1000,213);
  for(let row=0;row<16;row++){
    const y=316+row*row*.91;
    ctx.beginPath();ctx.strokeStyle='rgba(135,200,221,'+(.07+row*.009)+')';
    for(let x=0;x<=1000;x+=8)ctx.lineTo(x,y+Math.sin(x/(19+row*2)-elapsed*(1+h*.25)+row)*(.9+h*row*.13));
    ctx.stroke();
  }
  const sx=501-36*Math.sin(distance*.09), sy=348+Math.sin(elapsed*2.2)*(1+h*3);
  for(let i=0;i<14;i++){
    const phase=(i/14+elapsed*(.12+speed*.025))%1;
    ctx.beginPath();ctx.strokeStyle='rgba(149,226,235,'+((1-phase)*Math.min(.45,speed*.05))+')';
    ctx.ellipse(sx+185+phase*150,sy+22+phase*30,23+phase*24,2+phase*5,.12,0,Math.PI*2);ctx.stroke();
  }
  if(ship.complete&&ship.naturalWidth){
    ctx.save();ctx.translate(sx,sy);ctx.rotate(Math.sin(elapsed*1.85)*h*.012);
    ctx.drawImage(ship,-350,-302,700,307);ctx.restore();
  }
}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  const {h,target}=settings();
  if(playing){elapsed+=dt;speed+=(target-speed)*(1-Math.exp(-dt*1.7));distance+=speed*dt;}
  get('speed').textContent=speed.toFixed(1)+' m/s';
  get('distance').textContent=distance.toFixed(1)+' m';
  paint(h);requestAnimationFrame(frame);
}
get('toggle').onclick=()=>{playing=!playing;get('toggle').textContent=playing?'일시 정지':'계속 항해';};
get('reset').onclick=()=>{elapsed=distance=speed=0;wind.value=8;wave.value=1.2;drive.value=40;playing=true;get('toggle').textContent='일시 정지';};
requestAnimationFrame(frame);
</script>
